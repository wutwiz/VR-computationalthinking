<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR By Cool WUTWIZ</title>
    
    <!-- นำเข้าไลบรารีที่จำเป็น -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <!-- ไลบรารีสำหรับจุดพลุ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Prompt', sans-serif; overflow: hidden; background-color: #f0f9ff; color: #334155; }
        
        .bg-animation { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); }
        .bg-animation li { position: absolute; display: block; list-style: none; width: 20px; height: 20px; background: rgba(59, 130, 246, 0.15); animation: floatUp 25s linear infinite; bottom: -150px; border-radius: 50%; }
        .bg-animation li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .bg-animation li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bg-animation li:nth-child(3) { left: 70%; width: 40px; height: 40px; animation-delay: 4s; }
        .bg-animation li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .bg-animation li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .bg-animation li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .bg-animation li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .bg-animation li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .bg-animation li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .bg-animation li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; } 100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 30%; } }

        /* ปุ่มมุมขวาบน (Admin & Home) */
        .top-right-btn { position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; cursor: pointer; z-index: 50; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); border: 2px solid #ffffff; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .top-right-btn:hover { background: #ffffff; transform: scale(1.1); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3); }
        .top-right-btn svg { width: 22px; height: 22px; fill: #3b82f6; }
        #home-btn { display: none; } /* ซ่อนไว้ก่อน จะโชว์ตอนกล้องเปิด */

        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 30; padding: 20px; box-sizing: border-box; }
        .split-card { display: flex; width: 100%; max-width: 850px; min-height: 500px; background: #ffffff; border-radius: 24px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15); overflow: hidden; position: relative; }
        
        .left-panel { flex: 1; background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 50%, #38bdf8 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 40px 90px 40px 40px; color: white; text-align: center; }
        
        .logo-img { max-width: 260px; max-height: 260px; width: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); z-index: 2; transition: 0.3s; }
        .logo-img:hover { transform: scale(1.05); }
        .wave-divider { position: absolute; right: -1px; top: 0; height: 100%; width: 120px; z-index: 1; }
        
        .right-panel { flex: 1.2; background: #ffffff; padding: 40px 50px; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
        .form-title { color: #2563eb; font-size: 26px; font-weight: 700; margin-bottom: 30px; text-align: center; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 22px; display: flex; gap: 15px; width: 100%; }
        .input-box { flex: 1; position: relative; }
        .input-box input, .input-box select { width: 100%; padding: 10px 5px; border: none; border-bottom: 2px solid #cbd5e1; background: transparent; color: #0f172a; font-family: 'Prompt'; font-size: 15px; font-weight: 600; transition: 0.3s; box-sizing: border-box; appearance: none; }
        .input-box select { cursor: pointer; color: #334155; }
        .input-box input:focus, .input-box select:focus { outline: none; border-bottom-color: #3b82f6; border-bottom-width: 3px; }
        .input-box input::placeholder { color: #94a3b8; font-weight: 400; font-size: 14px; }
        
        .btn-wrapper { text-align: center; margin-top: 10px; }
        #start-btn { background: linear-gradient(135deg, #a78bfa, #3b82f6); color: #ffffff; border: none; padding: 15px 40px; font-size: 17px; font-family: 'Prompt'; font-weight: 600; border-radius: 30px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); opacity: 0.6; width: 100%; }
        #start-btn:hover:not([disabled]) { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4); opacity: 1; }
        
        #status-msg { margin-top: 15px; font-size: 13px; font-weight: 500; color: #64748b; text-align: center; }
        .copyright { text-align: center; font-size: 12px; font-weight: 400; color: #94a3b8; margin-top: 25px; letter-spacing: 0.5px; }

        @media (max-width: 768px) {
            .split-card { flex-direction: column; min-height: auto; }
            .left-panel { padding: 40px; }
            .logo-img { max-width: 180px; max-height: 180px; }
            .wave-divider { display: none; }
            .right-panel { padding: 35px 25px; }
        }

        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        #header { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 20px 30px; margin-top: 25px; text-align: center; display: none; width: 85%; max-width: 700px; box-shadow: 0 10px 30px rgba(15,23,42,0.1); border: 2px solid #e0f2fe; }
        #question-text { font-size: 24px; font-weight: 600; color: #1e293b; margin: 0 0 12px 0; line-height: 1.4; }
        #score-board { font-size: 18px; font-weight: 700; color: #2563eb; background: #eff6ff; padding: 8px 20px; border-radius: 30px; display: inline-block; border: 1px solid #bfdbfe; }

        .flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; display: none; opacity: 0; transition: opacity 0.2s; }
        .flash-correct { background: rgba(220, 252, 231, 0.6); border: 15px solid #22c55e; box-sizing: border-box; }
        .flash-wrong { background: rgba(254, 226, 226, 0.6); border: 15px solid #ef4444; box-sizing: border-box; }

        /* อนิเมชันหน้าจบเกมที่เพิ่มใหม่ */
        #end-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240, 249, 255, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 40; text-align: center; backdrop-filter: blur(10px); }
        .end-title { color: #10b981; font-size: 45px; margin: 0; animation: slideUp 0.6s ease-out; }
        #congrats-text { font-size: 28px; color: #1e293b; font-weight: 600; margin: 15px 0; animation: slideUp 0.8s ease-out; }
        #player-name-display { color: #3b82f6; font-weight: 700; text-shadow: 0 2px 4px rgba(59,130,246,0.2); }
        .score-container { display: flex; flex-direction: column; align-items: center; margin: 15px 0; animation: zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .score-container span { font-size: 18px; color: #64748b; font-weight: 500; }
        #final-score { font-size: 110px; color: #10b981; margin: -5px 0 0 0; font-weight: 700; text-shadow: 0 8px 20px rgba(16,185,129,0.3); line-height: 1.1; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

        .input_video { display: none; }
        .output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; filter: brightness(1.1); }
    </style>
</head>
<body>
    
    <ul class="bg-animation"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul>

    <!-- ปุ่ม Admin (โชว์ตอนหน้าแรก) -->
    <div id="admin-btn" class="top-right-btn" onclick="checkAdmin()" title="สำหรับผู้สอน">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </div>

    <!-- ปุ่ม Home (โชว์ตอนเล่นเกม) -->
    <div id="home-btn" class="top-right-btn" onclick="confirmExit()" title="กลับหน้าหลัก">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </div>

    <div id="start-screen">
        <div class="split-card">
            <div class="left-panel">
                <svg class="wave-divider" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 Q100,25 50,50 T100,100 L100,0 Z" fill="#ffffff"></path></svg>
                <img src="https://lh3.googleusercontent.com/d/1OlnOFbMdhTbyWy1JNAtaGeBgH-XW3HYO" alt="Logo" class="logo-img">
            </div>
            
            <div class="right-panel">
                <div class="form-title">AR-based learning</div>
                
                <div class="form-group">
                    <div class="input-box"><input type="text" id="stu-name" placeholder="ชื่อ - นามสกุล"></div>
                </div>
                
                <div class="form-group">
                    <div class="input-box" style="flex: 1.3;">
                        <select id="stu-level">
                            <option value="" disabled selected>เลือกระดับชั้น</option>
                            <option value="ม.1">ม.1</option><option value="ม.2">ม.2</option><option value="ม.3">ม.3</option>
                            <option value="ม.4">ม.4</option><option value="ม.5">ม.5</option><option value="ม.6">ม.6</option>
                        </select>
                    </div>
                    <div class="input-box" style="flex: 1;">
                        <select id="stu-room"><option value="" disabled selected>เลือกห้อง</option></select>
                    </div>
                    <div class="input-box" style="flex: 1;">
                        <input type="number" id="stu-number" placeholder="เลขที่">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <select id="game-category"><option value="" disabled selected>กำลังโหลดข้อมูล...</option></select>
                    </div>
                </div>

                <div class="btn-wrapper">
                    <button id="start-btn" onclick="startGame()" disabled>เข้าสู่ระบบ</button>
                    <div id="status-msg">กำลังเตรียมความพร้อมของระบบ...</div>
                </div>

                <div class="copyright">© สงวนลิขสิทธิ์โดย ครูวรวุฒิ เนื้อทอง</div>
            </div>
        </div>
    </div>

    <div id="game-ui">
        <div id="header">
            <h2 id="question-text">เตรียมพร้อม...</h2>
            <div id="score-board">คะแนนสะสม: <span id="score">0</span></div>
        </div>
    </div>
    
    <div id="flash-fx" class="flash-overlay"></div>

    <!-- โฉมใหม่หน้าจบเกม -->
    <div id="end-screen">
        <h1 class="end-title">สิ้นสุดภารกิจ</h1>
        <h2 id="congrats-text">ยินดีด้วย คุณ <span id="player-name-display">...</span></h2>
        
        <div class="score-container">
            <span>ทำคะแนนได้</span>
            <div id="final-score">0</div>
        </div>
        
        <p id="save-status" style="color: #475569; font-size: 18px; margin-bottom: 35px; font-weight: 500;">กำลังส่งข้อมูลให้คุณครู...</p>
        <button style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: #ffffff; padding: 15px 40px; border-radius: 12px; font-size: 20px; border: none; font-family: 'Prompt'; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px rgba(37,99,235,0.3); z-index: 60;" onclick="location.reload()">เล่นอีกครั้ง</button>
    </div>

    <video class="input_video" autoplay playsinline></video>
    <canvas class="output_canvas"></canvas>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwF9527Ppfs27WgKj6zffbrnYA4kGdWNkq3WGljegm9k1JCdrgzPxdX65NRs7ungLWIHA/exec"; 

        let studentData = { name: "", number: "", level: "", room: "", category: "" };
        let questions = [];
        let score = 0;
        let currentQuestionIndex = 0;
        let gameActive = false; 
        let isProcessingHit = false; 
        
        let smoothX = 0, smoothY = 0;
        const EMA_ALPHA = 0.4; 

        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.querySelector('.output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const flashFx = document.getElementById('flash-fx');

        window.onload = async () => {
            const roomSelect = document.getElementById('stu-room');
            for(let i=1; i<=25; i++) roomSelect.innerHTML += `<option value="${i}">${i}</option>`;

            try {
                const res = await fetch(API_URL + "?action=getCategories", {redirect: "follow"});
                const categories = await res.json();
                
                const catSelect = document.getElementById('game-category');
                if(categories.length > 0) {
                    catSelect.innerHTML = `<option value="" disabled selected>เลือกบทเรียน</option>`;
                    categories.forEach(c => catSelect.innerHTML += `<option value="${c.name}">${c.name}</option>`);
                    document.getElementById('status-msg').innerHTML = "ระบบพร้อมใช้งาน";
                    document.getElementById('status-msg').style.color = "#3b82f6";
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('start-btn').style.opacity = '1';
                } else {
                    catSelect.innerHTML = `<option value="" disabled selected>ไม่มีหมวดหมู่</option>`;
                    document.getElementById('status-msg').innerHTML = "ยังไม่มีข้อสอบในระบบ";
                    document.getElementById('status-msg').style.color = "#ef4444";
                }
            } catch (err) {
                document.getElementById('status-msg').innerHTML = "เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว";
                document.getElementById('status-msg').style.color = "#ef4444";
            }
        };

        function checkAdmin() {
            Swal.fire({
                title: 'เข้าสู่ระบบผู้สอน',
                input: 'password',
                inputPlaceholder: 'กรอกรหัสผ่าน',
                showCancelButton: true,
                confirmButtonText: 'เข้าสู่ระบบ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#94a3b8'
            }).then((result) => {
                if (result.isConfirmed) {
                    if (result.value === "1234") {
                        window.location.href = "Admin.html"; 
                    } else {
                        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: 'รหัสผ่านไม่ถูกต้อง', confirmButtonColor: '#3b82f6' });
                    }
                }
            });
        }

        // ระบบปุ่ม Home ถามยืนยันก่อนออก
        function confirmExit() {
            Swal.fire({
                title: 'ต้องการออกจากบทเรียน?',
                text: "คะแนนปัจจุบันของนักเรียนจะไม่ถูกบันทึกนะ!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'ใช่, กลับหน้าหลัก',
                cancelButtonText: 'เล่นต่อ'
            }).then((result) => {
                if (result.isConfirmed) {
                    location.reload();
                }
            });
        }

        async function startGame() {
            let name = document.getElementById('stu-name').value;
            let number = document.getElementById('stu-number').value;
            let level = document.getElementById('stu-level').value;
            let room = document.getElementById('stu-room').value;
            let cat = document.getElementById('game-category').value;

            if(!name || !number || !level || !room || !cat) { 
                Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: 'กรุณากรอกข้อมูลให้ครบทุกช่องก่อนเริ่ม', confirmButtonColor: '#3b82f6' });
                return; 
            }

            studentData = { name, number, level, room, category: cat };
            
            const btn = document.getElementById('start-btn');
            btn.disabled = true; btn.innerText = "กำลังโหลดข้อสอบ...";
            document.getElementById('status-msg').innerHTML = "กำลังเปิดกล้อง AI...";

            try {
                const res = await fetch(API_URL + `?action=getQuestions&category=${encodeURIComponent(cat)}`, {redirect: "follow"});
                const data = await res.json();
                if(data.length === 0) { 
                    Swal.fire({ icon: 'info', title: 'ไม่มีข้อสอบ', text: 'หมวดหมู่นี้ยังไม่มีโจทย์', confirmButtonColor: '#3b82f6' });
                    btn.disabled = false; btn.innerText = "เข้าสู่ระบบ"; return; 
                }
                questions = data;
                initSystem();
            } catch (err) { 
                Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: 'เกิดปัญหาในการโหลดข้อสอบ', confirmButtonColor: '#3b82f6' });
                btn.disabled = false; btn.innerText = "เข้าสู่ระบบ"; 
            }
        }

        let activeBalloons = [];

        function spawnBalloons() {
            if (currentQuestionIndex >= questions.length) { endGame(); return; }
            const currentQ = questions[currentQuestionIndex];
            document.getElementById('question-text').innerText = `ข้อ ${currentQuestionIndex + 1}: ` + currentQ.q;
            activeBalloons = [];
            
            let validChoices = currentQ.choices.filter(c => c.text !== "");
            let shuffledChoices = validChoices.sort(() => Math.random() - 0.5);
            
            const spacing = canvasElement.width / (shuffledChoices.length + 1);
            const pastelColors = ["#fca5a5", "#93c5fd", "#86efac", "#fde047"];
            
            shuffledChoices.forEach((choice, index) => {
                activeBalloons.push({
                    x: spacing * (index + 1), y: canvasElement.height + 200, 
                    radius: canvasElement.width < 800 ? 55 : 80, text: choice.text, color: pastelColors[index],
                    isCorrect: choice.isCorrect, speed: (canvasElement.height / 350) + (Math.random() * 2) 
                });
            });
        }

        function showFeedback(isCorrect) {
            flashFx.className = 'flash-overlay ' + (isCorrect ? 'flash-correct' : 'flash-wrong');
            flashFx.style.display = 'block'; flashFx.style.opacity = '1';
            setTimeout(() => { flashFx.style.opacity = '0'; setTimeout(() => { flashFx.style.display = 'none'; }, 200); }, 300);
        }

        // ฟังก์ชันจุดพลุสุดอลังการ
        function launchFireworks() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 50 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        async function endGame() {
            gameActive = false;
            document.getElementById('header').style.display = 'none';
            document.getElementById('home-btn').style.display = 'none'; // ซ่อนปุ่ม Home ตอนจบเกม
            document.getElementById('end-screen').style.display = 'flex';
            
            // อัปเดตข้อมูลหน้าจบ
            document.getElementById('final-score').innerText = score;
            document.getElementById('player-name-display').innerText = studentData.name;
            activeBalloons = [];
            
            // จุดพลุฉลอง
            launchFireworks();

            try {
                const url = API_URL + `?action=saveScore&name=${encodeURIComponent(studentData.name)}&number=${studentData.number}&level=${encodeURIComponent(studentData.level)}&room=${studentData.room}&category=${encodeURIComponent(studentData.category)}&score=${score}`;
                const res = await fetch(url, { redirect: "follow" });
                const result = await res.json();
                if(result.status === "success") {
                    document.getElementById('save-status').innerText = "บันทึกคะแนนลงระบบสำเร็จ";
                    document.getElementById('save-status').style.color = "#059669";
                }
            } catch (err) { document.getElementById('save-status').innerText = "บันทึกคะแนนไม่สำเร็จ"; document.getElementById('save-status').style.color = "#dc2626"; }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

        hands.onResults((results) => {
            if (document.getElementById('start-screen').style.display !== 'none' && questions.length > 0) {
                document.getElementById('start-screen').style.display = 'none';
                
                // สลับปุ่มโชว์ Home ซ่อน Admin
                document.getElementById('admin-btn').style.display = 'none';
                document.getElementById('home-btn').style.display = 'flex';

                document.querySelector('.bg-animation').style.display = 'none'; 
                document.body.style.background = '#000'; 
                canvasElement.style.backgroundColor = '#000'; 

                document.getElementById('header').style.display = 'block';
                gameActive = true; spawnBalloons();
            }

            canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0); canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0); canvasCtx.scale(-1, 1);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                let rawX = (1 - landmarks[8].x) * canvasElement.width;
                let rawY = landmarks[8].y * canvasElement.height;
                if (smoothX === 0) { smoothX = rawX; smoothY = rawY; } 
                else { smoothX = (EMA_ALPHA * rawX) + ((1 - EMA_ALPHA) * smoothX); smoothY = (EMA_ALPHA * rawY) + ((1 - EMA_ALPHA) * smoothY); }

                canvasCtx.beginPath(); canvasCtx.arc(smoothX, smoothY, 18, 0, 2 * Math.PI);
                canvasCtx.lineWidth = 4; canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.9)"; canvasCtx.stroke();
                canvasCtx.beginPath(); canvasCtx.arc(smoothX, smoothY, 6, 0, 2 * Math.PI);
                canvasCtx.fillStyle = "#3b82f6"; canvasCtx.fill();

                if (gameActive && !isProcessingHit) {
                    for (let i = activeBalloons.length - 1; i >= 0; i--) {
                        let b = activeBalloons[i];
                        if (Math.hypot(b.x - smoothX, b.y - smoothY) < b.radius) {
                            isProcessingHit = true; 
                            if (b.isCorrect) { score += 10; document.getElementById('score').innerText = score; showFeedback(true); } 
                            else { showFeedback(false); }
                            setTimeout(() => { currentQuestionIndex++; isProcessingHit = false; spawnBalloons(); }, 400);
                            break; 
                        }
                    }
                }
            }

            if (gameActive) {
                for (let i = activeBalloons.length - 1; i >= 0; i--) {
                    let b = activeBalloons[i];
                    if(!isProcessingHit) b.y -= b.speed;
                    
                    canvasCtx.beginPath(); canvasCtx.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = b.color + "E6"; 
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 3; canvasCtx.strokeStyle = "#ffffff"; canvasCtx.stroke();

                    canvasCtx.fillStyle = "#0f172a"; canvasCtx.font = "bold " + (b.radius/3.2) + "px Prompt";
                    canvasCtx.textAlign = "center"; canvasCtx.textBaseline = "middle";
                    canvasCtx.fillText(b.text.length > 15 ? b.text.substring(0, 12) + "..." : b.text, b.x, b.y);
                    
                    if (b.y + b.radius < -100) b.y = canvasElement.height + 200;
                }
            }
            canvasCtx.restore();
        });

        async function initSystem() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { 
                Swal.fire({ icon: 'error', title: 'กล้องไม่พร้อม', text: 'อุปกรณ์ไม่รองรับกล้อง', confirmButtonColor: '#3b82f6' });
                return; 
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play(); canvasElement.width = videoElement.videoWidth; canvasElement.height = videoElement.videoHeight;
                    let lastVideoTime = -1;
                    const processFrame = async () => {
                        if (videoElement.currentTime !== lastVideoTime) { lastVideoTime = videoElement.currentTime; await hands.send({image: videoElement}); }
                        requestAnimationFrame(processFrame);
                    }; requestAnimationFrame(processFrame);
                };
            } catch (error) { 
                Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: 'โปรดอนุญาตให้เบราว์เซอร์เข้าถึงกล้องก่อน', confirmButtonColor: '#3b82f6' });
                document.getElementById('start-btn').disabled = false; document.getElementById('start-btn').innerText = "เข้าสู่ระบบ"; 
            }
        }
    </script>
